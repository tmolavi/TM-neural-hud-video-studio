[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-neural-hud-video-studio"
version = "1.0.0"
description = "Deterministic Cyberpunk HUD Telemetry Video Studio for AI Agents and Software Repositories"
readme = "README.md"
authors = [{ name = "Taghi Molavi", email = "contact@molavi.pro" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0"
]

[project.urls]
Homepage = "https://molavi.pro"
Repository = "https://github.com/tmolavi/TM-neural-hud-video-studio"
Documentation = "https://molavi.pro/notes/tm-neural-hud-video-studio"
Agency = "https://inten.asia"

[project.scripts]
neural-hud = "scripts.render_video:main"
